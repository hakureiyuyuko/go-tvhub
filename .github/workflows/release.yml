name: release

# 推一个 v* 标签就会自动发版：
#   git tag v1.0.1 && git push origin v1.0.1
# 四个平台的二进制会由 runner 交叉编译（CGO_ENABLED=0，纯 Go SQLite 驱动，不需要 gcc）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: tvhub-linux-amd64,       goos: linux,   goarch: amd64 }
          - { name: tvhub-linux-arm64,       goos: linux,   goarch: arm64 }
          - { name: tvhub-linux-armv7,       goos: linux,   goarch: arm,   goarm: "7" }
          - { name: tvhub-windows-amd64.exe, goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet & test
        run: |
          go vet ./...
          go test ./...

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.name }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # runner 自带 gh CLI，所以不需要第三方 action
      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
