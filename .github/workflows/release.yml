name: release

# 推一个 v* 标签就会自动发版：
#   git tag v1.0.1 && git push origin v1.0.1
# 四个平台的二进制由 runner 交叉编译（CGO_ENABLED=0，纯 Go SQLite 驱动，不需要 gcc），
# 最后用 runner 自带的 gh CLI 建 Release 并上传产物与 SHA256SUMS.txt。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: tvhub-linux-amd64,       goos: linux,   goarch: amd64 }
          - { name: tvhub-linux-arm64,       goos: linux,   goarch: arm64 }
          - { name: tvhub-linux-armv7,       goos: linux,   goarch: arm,   goarm: "7" }
          - { name: tvhub-windows-amd64.exe, goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: vet & test
        run: |
          go vet ./...
          go test ./...

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.name }}" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh 需要 git 仓库上下文，缺了会报 "fatal: not a git repository"
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
